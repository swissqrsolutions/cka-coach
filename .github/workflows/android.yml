name: Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CKA-Coach.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: CKA Coach for Android
          body: Download CKA-Coach.apk on your phone and open it to install.
          files: CKA-Coach.apk
          make_latest: true
